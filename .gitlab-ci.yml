workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - verify
  - build
  - release

variables:
  GIT_DEPTH: "0"
  CARGO_TERM_COLOR: "always"
  RUNNER_TAG_LINUX_X86_64: "linux-x86-64"
  RUNNER_TAG_LINUX_ARM64: "linux-arm64"
  RUNNER_TAG_WINDOWS_X86_64: "windows-x86-64"
  RUNNER_TAG_MACOS_ARM64: "macos-arm64"

.linux_rust:
  image: rust:1.94.1-bullseye
  before_script:
    - apt-get update
    - >-
      apt-get install --yes --no-install-recommends
      pkg-config libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev
      libxrandr-dev libwayland-dev libxkbcommon-dev

version_check:
  stage: verify
  image: python:3.13-slim-bookworm
  tags:
    - $RUNNER_TAG_LINUX_X86_64
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends git
  script:
    - python scripts/check_version.py --previous-ref "$CI_COMMIT_BEFORE_SHA" --dotenv version.env
  artifacts:
    reports:
      dotenv: version.env

quality:
  extends: .linux_rust
  stage: verify
  tags:
    - $RUNNER_TAG_LINUX_X86_64
  needs:
    - job: version_check
      artifacts: true
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --all -- --check
    - cargo test --locked
    - cargo clippy --locked --all-targets -- -D warnings

build_linux_x86_64:
  extends: .linux_rust
  stage: build
  tags:
    - $RUNNER_TAG_LINUX_X86_64
  needs:
    - job: version_check
      artifacts: true
    - job: quality
      artifacts: false
  variables:
    RUST_TARGET: "x86_64-unknown-linux-gnu"
    PLATFORM_NAME: "linux-x86_64"
  script:
    - rustup target add "$RUST_TARGET"
    - cargo build --locked --release --target "$RUST_TARGET"
    - mkdir -p dist
    - tar -C "target/$RUST_TARGET/release" -czf "dist/eeg-image-${APP_VERSION}-${PLATFORM_NAME}.tar.gz" eeg-image
  artifacts:
    expire_in: 1 week
    paths:
      - dist/

build_linux_arm64:
  extends: .linux_rust
  stage: build
  tags:
    - $RUNNER_TAG_LINUX_ARM64
  needs:
    - job: version_check
      artifacts: true
    - job: quality
      artifacts: false
  variables:
    RUST_TARGET: "aarch64-unknown-linux-gnu"
    PLATFORM_NAME: "linux-aarch64"
  script:
    - rustup target add "$RUST_TARGET"
    - cargo build --locked --release --target "$RUST_TARGET"
    - mkdir -p dist
    - tar -C "target/$RUST_TARGET/release" -czf "dist/eeg-image-${APP_VERSION}-${PLATFORM_NAME}.tar.gz" eeg-image
  artifacts:
    expire_in: 1 week
    paths:
      - dist/

build_windows_x86_64:
  stage: build
  tags:
    - $RUNNER_TAG_WINDOWS_X86_64
  needs:
    - job: version_check
      artifacts: true
    - job: quality
      artifacts: false
  variables:
    RUST_TARGET: "x86_64-pc-windows-msvc"
    PLATFORM_NAME: "windows-x86_64"
  script:
    - |
      $ErrorActionPreference = "Stop"
      rustup target add $env:RUST_TARGET
      cargo build --locked --release --target $env:RUST_TARGET
      New-Item -ItemType Directory -Force -Path dist | Out-Null
      $archive = "dist/eeg-image-${env:APP_VERSION}-${env:PLATFORM_NAME}.zip"
      Compress-Archive -Path "target/${env:RUST_TARGET}/release/eeg-image.exe" -DestinationPath $archive -Force
  artifacts:
    expire_in: 1 week
    paths:
      - dist/

build_windows_arm64:
  stage: build
  tags:
    - $RUNNER_TAG_WINDOWS_X86_64
  needs:
    - job: version_check
      artifacts: true
    - job: quality
      artifacts: false
  variables:
    RUST_TARGET: "aarch64-pc-windows-msvc"
    PLATFORM_NAME: "windows-aarch64"
  script:
    - |
      $ErrorActionPreference = "Stop"
      rustup target add $env:RUST_TARGET
      cargo build --locked --release --target $env:RUST_TARGET
      New-Item -ItemType Directory -Force -Path dist | Out-Null
      $archive = "dist/eeg-image-${env:APP_VERSION}-${env:PLATFORM_NAME}.zip"
      Compress-Archive -Path "target/${env:RUST_TARGET}/release/eeg-image.exe" -DestinationPath $archive -Force
  artifacts:
    expire_in: 1 week
    paths:
      - dist/

build_macos_arm64:
  stage: build
  tags:
    - $RUNNER_TAG_MACOS_ARM64
  needs:
    - job: version_check
      artifacts: true
    - job: quality
      artifacts: false
  variables:
    RUST_TARGET: "aarch64-apple-darwin"
    PLATFORM_NAME: "macos-aarch64"
  script:
    - rustup target add "$RUST_TARGET"
    - cargo build --locked --release --target "$RUST_TARGET"
    - mkdir -p dist
    - tar -C "target/$RUST_TARGET/release" -czf "dist/eeg-image-${APP_VERSION}-${PLATFORM_NAME}.tar.gz" eeg-image
  artifacts:
    expire_in: 1 week
    paths:
      - dist/

publish_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  tags:
    - $RUNNER_TAG_LINUX_X86_64
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  needs:
    - job: version_check
      artifacts: true
    - job: build_linux_x86_64
      artifacts: true
    - job: build_linux_arm64
      artifacts: true
    - job: build_windows_x86_64
      artifacts: true
    - job: build_windows_arm64
      artifacts: true
    - job: build_macos_arm64
      artifacts: true
  script:
    - >-
      glab release create "v${APP_VERSION}" dist/*
      --name "eeg-image v${APP_VERSION}"
      --notes "Автоматическая сборка eeg-image ${APP_VERSION} для Linux, Windows и macOS."
      --ref "$CI_COMMIT_SHA"
      --use-package-registry
      --package-name "eeg-image"
