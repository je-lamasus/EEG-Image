name: Build and release

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version_check:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      app_version: ${{ steps.version.outputs.APP_VERSION }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a version bump
        id: version
        env:
          PREVIOUS_REF: ${{ github.event.before }}
        run: |
          python3 scripts/check_version.py \
            --previous-ref "$PREVIOUS_REF" \
            --dotenv version.env
          cat version.env >> "$GITHUB_OUTPUT"

  quality:
    name: Format, test and lint
    runs-on: ubuntu-24.04
    needs: version_check
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            pkg-config libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev \
            libxrandr-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.94.1 \
            --profile minimal \
            --component clippy \
            --component rustfmt

      - name: Check formatting
        run: cargo +1.94.1 fmt --all -- --check

      - name: Run tests
        run: cargo +1.94.1 test --locked

      - name: Run Clippy
        run: cargo +1.94.1 clippy --locked --all-targets -- -D warnings

  build_linux:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs:
      - version_check
      - quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
    env:
      APP_VERSION: ${{ needs.version_check.outputs.app_version }}
      RUST_TARGET: ${{ matrix.target }}
      PLATFORM_NAME: ${{ matrix.platform }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            pkg-config libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev \
            libxrandr-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust target
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup target add "$RUST_TARGET" --toolchain 1.94.1

      - name: Build release binary
        run: cargo +1.94.1 build --locked --release --target "$RUST_TARGET"

      - name: Package binary
        run: |
          mkdir -p dist
          tar -C "target/$RUST_TARGET/release" \
            -czf "dist/eeg-image-${APP_VERSION}-${PLATFORM_NAME}.tar.gz" \
            eeg-image

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          path: dist/eeg-image-${{ env.APP_VERSION }}-${{ matrix.platform }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 7

  build_windows:
    name: Build ${{ matrix.platform }}
    runs-on: windows-2025
    needs:
      - version_check
      - quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - target: aarch64-pc-windows-msvc
            platform: windows-aarch64
    env:
      APP_VERSION: ${{ needs.version_check.outputs.app_version }}
      RUST_TARGET: ${{ matrix.target }}
      PLATFORM_NAME: ${{ matrix.platform }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust target
        shell: pwsh
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup target add $env:RUST_TARGET --toolchain 1.94.1

      - name: Build release binary
        shell: pwsh
        run: cargo +1.94.1 build --locked --release --target $env:RUST_TARGET

      - name: Package binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "dist/eeg-image-${env:APP_VERSION}-${env:PLATFORM_NAME}.zip"
          Compress-Archive -Path "target/${env:RUST_TARGET}/release/eeg-image.exe" -DestinationPath $archive -Force

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          path: dist/eeg-image-${{ env.APP_VERSION }}-${{ matrix.platform }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

  build_macos:
    name: Build macos-aarch64
    runs-on: macos-15
    needs:
      - version_check
      - quality
    env:
      APP_VERSION: ${{ needs.version_check.outputs.app_version }}
      RUST_TARGET: aarch64-apple-darwin
      PLATFORM_NAME: macos-aarch64
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"

      - name: Install Rust target
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup target add "$RUST_TARGET" --toolchain 1.94.1

      - name: Build release binary
        run: cargo +1.94.1 build --locked --release --target "$RUST_TARGET"

      - name: Create application bundle
        run: |
          app_bundle="dist/EEG Image.app"
          mkdir -p "$app_bundle/Contents/MacOS"
          mkdir -p "$app_bundle/Contents/Resources"
          cp "target/$RUST_TARGET/release/eeg-image" \
            "$app_bundle/Contents/MacOS/eeg-image"
          cp packaging/macos/Info.plist "$app_bundle/Contents/Info.plist"
          cp packaging/icons/app-icon.icns \
            "$app_bundle/Contents/Resources/AppIcon.icns"
          chmod 755 "$app_bundle/Contents/MacOS/eeg-image"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $APP_VERSION" \
            "$app_bundle/Contents/Info.plist"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion $APP_VERSION" \
            "$app_bundle/Contents/Info.plist"

      - name: Check macOS signing configuration
        id: macos_signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          required=(
            APPLE_CERTIFICATE_BASE64
            APPLE_CERTIFICATE_PASSWORD
            APPLE_ID
            APPLE_TEAM_ID
            APPLE_APP_SPECIFIC_PASSWORD
          )
          configured=0

          for variable in "${required[@]}"; do
            if [[ -n "${!variable}" ]]; then
              configured=$((configured + 1))
            fi
          done

          if [[ "$configured" -eq 0 ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS signing secrets are not configured; publishing an unsigned app"
          elif [[ "$configured" -ne "${#required[@]}" ]]; then
            echo "::error::macOS signing is only partially configured; check all required secrets"
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID certificate
        if: steps.macos_signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/eeg-image-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              awk -F '"' '/Developer ID Application/ { print $2; exit }'
          )"
          if [[ -z "$signing_identity" ]]; then
            echo "::error::Developer ID Application identity was not found in the certificate"
            exit 1
          fi

          echo "MACOS_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "MACOS_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Sign and notarize application
        if: steps.macos_signing.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          app_bundle="dist/EEG Image.app"
          notarization_archive="$RUNNER_TEMP/eeg-image-notarization.zip"

          codesign \
            --force \
            --options runtime \
            --timestamp \
            --keychain "$MACOS_KEYCHAIN_PATH" \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "$app_bundle"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"

          ditto -c -k --sequesterRsrc --keepParent \
            "$app_bundle" "$notarization_archive"
          xcrun notarytool submit "$notarization_archive" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "$app_bundle"
          xcrun stapler validate "$app_bundle"
          spctl --assess --type execute --verbose=2 "$app_bundle"

      - name: Package application
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/EEG Image.app" \
            "dist/eeg-image-${APP_VERSION}-${PLATFORM_NAME}.zip"

      - name: Remove temporary signing files
        if: always() && steps.macos_signing.outputs.enabled == 'true'
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12"
          rm -f "$RUNNER_TEMP/eeg-image-notarization.zip"
          if [[ -n "${MACOS_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$MACOS_KEYCHAIN_PATH" || true
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          path: dist/eeg-image-${{ env.APP_VERSION }}-macos-aarch64.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

  publish_release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs:
      - version_check
      - build_linux
      - build_windows
      - build_macos
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.version_check.outputs.app_version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: eeg-image-*
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Publish release
        run: |
          tag="v${APP_VERSION}"

          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "$GH_REPO"
          else
            gh release create "$tag" dist/* \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "eeg-image v${APP_VERSION}" \
              --notes "Автоматическая сборка для Linux, Windows и macOS." \
              --generate-notes
          fi
